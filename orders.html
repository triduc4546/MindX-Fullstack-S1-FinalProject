<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ducky Coffee Shop – Orders</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="min-h-screen">
    <div id="navbar" class="sticky z-50 top-0">
        <nav class="bg-white text-black border-b border-gray-200">
            <div class="mx-auto flex max-w-7xl flex-col gap-4 px-6 py-4 sm:flex-row sm:items-center sm:justify-between">
                <a href="#" class="text-3xl font-bold">DUCKY COFFEE SHOP</a>
                <div class="flex flex-wrap gap-20">
                     <a href="index.html" class="text-black font-black text-xl">Home</a>
                     <a href="products.html" class="text-black font-black text-xl">Products</a>
                     <a href="orders.html" class="text-black font-black text-xl">Orders</a>
                     <a href="#login" class="text-black font-bold rounded-2xl outline outline-offset-8">Login</a>
                </div>
            </div>
        </nav>
    </div>

    <main class="mx-auto max-w-[1500px] px-6 py-8">
        <h1 class="text-3xl font-bold tracking-tight">Orders</h1>
        <p id="summary" class="mt-3 text-gray-700">Orders placed from the catalog</p>

        <!-- Order cards are rendered here by the script below -->
        <div id="order-list" class="mt-9 grid grid-cols-1 gap-6 md:grid-cols-2 lg:grid-cols-3"></div>

        <!-- Shown when there are no orders -->
        <div id="empty" class="mt-9 hidden rounded-2xl border border-gray-200 bg-white p-10 text-center shadow-sm">
            <p class="text-lg font-semibold">No orders yet</p>
            <p class="mt-2 text-gray-600">Orders you place on the Products page will show up here.</p>
            <a href="products.html" class="mt-5 inline-block rounded-lg bg-amber-400 px-5 py-2.5 font-semibold text-black hover:brightness-95">Browse products</a>
        </div>
    </main>

    <script>
        const STORAGE_KEY = "orders";

        /* ---------- Storage helpers ---------- */
        function getOrders() {
            try {
                const list = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
                return Array.isArray(list) ? list : [];
            } catch (e) { return []; }
        }
        function saveOrders(list) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
        }
        function removeOrder(id) {
            // keep every order except the one with this id, then save the shorter list
            saveOrders(getOrders().filter(o => String(o.id) !== String(id)));
        }

        /* ---------- Rendering ---------- */
        const listEl = document.getElementById("order-list");
        const emptyEl = document.getElementById("empty");
        const summaryEl = document.getElementById("summary");

        // Escape text so names/notes typed by users can't inject HTML
        function esc(value) {
            return String(value ?? "").replace(/[&<>"']/g, c => (
                { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
            ));
        }
        function formatTime(iso) {
            const d = new Date(iso);
            return isNaN(d) ? "Unknown time" : d.toLocaleString("en-GB", { dateStyle: "medium", timeStyle: "short" });
        }

        function orderCard(o) {
            const note = o.note
                ? `<p class="mt-4 rounded-lg bg-gray-100 px-3 py-2 text-sm text-gray-700"><span class="font-medium">Note:</span> ${esc(o.note)}</p>`
                : "";
            return `
            <article class="flex flex-col overflow-hidden rounded-2xl border border-gray-200 bg-white shadow-sm transition hover:shadow-md">
                <div class="flex items-center justify-between bg-gray-100 px-4 py-3">
                    <span class="text-lg font-extrabold tracking-tight">Order #${esc(o.id)}</span>
                    <span class="text-xs font-medium text-gray-600">${esc(formatTime(o.createdAt))}</span>
                </div>
                <div class="flex flex-1 flex-col px-4 pb-4 pt-5">
                    <h2 class="text-base font-semibold">${esc(o.product || "Product not recorded")}</h2>
                    <dl class="mt-4 space-y-2 text-sm">
                        <div class="flex gap-2"><dt class="w-16 shrink-0 font-medium text-amber-500">Name</dt><dd class="break-words text-gray-700">${esc(o.name)}</dd></div>
                        <div class="flex gap-2"><dt class="w-16 shrink-0 font-medium text-amber-500">Phone</dt><dd class="break-words text-gray-700">${esc(o.phone)}</dd></div>
                        <div class="flex gap-2"><dt class="w-16 shrink-0 font-medium text-amber-500">Email</dt><dd class="break-all text-gray-700">${esc(o.email)}</dd></div>
                    </dl>
                    ${note}
                    <button type="button" data-remove="${esc(o.id)}" class="mt-5 flex h-11 w-full items-center justify-center rounded-lg border border-red-300 text-[15px] font-medium text-red-600 transition hover:bg-red-50 active:scale-[.99]">Remove order</button>
                </div>
            </article>`;
        }

        function render() {
            // newest orders first
            const orders = getOrders().slice().sort((a, b) => Number(b.id) - Number(a.id));
            listEl.innerHTML = orders.map(orderCard).join("");
            emptyEl.classList.toggle("hidden", orders.length > 0);
            summaryEl.textContent = orders.length
                ? `${orders.length} order${orders.length === 1 ? "" : "s"} placed from the catalog`
                : "Orders placed from the catalog";
        }

        // One listener for all Remove buttons (works for cards added by render())
        listEl.addEventListener("click", e => {
            const btn = e.target.closest("[data-remove]");
            if (!btn) return;
            const id = btn.dataset.remove;
            if (!confirm(`Remove order #${id}? This cannot be undone.`)) return;
            try {
                removeOrder(id);
            } catch (err) {
                alert("Could not update the saved orders in this browser.");
                return;
            }
            render();
        });

        // Keep the list in sync if orders change in another tab
        window.addEventListener("storage", e => { if (e.key === STORAGE_KEY) render(); });

        render();
    </script>
</body>
</html>
